#cloud-config
package_update: true
package_upgrade: true

packages:
  - ca-certificates
  - curl
  - git
  - ufw

write_files:
  - path: /opt/phoenix-feed/bootstrap.sh
    owner: root:root
    permissions: "0755"
    content: |
      #!/usr/bin/env bash
      set -euo pipefail

      PUBLIC_REPO_URL="${PUBLIC_REPO_URL:-https://example.com/owner/phoenix-feed.git}"
      APP_DIR="/opt/phoenix-feed/app"

      install -m 0755 -d /etc/apt/keyrings
      curl -fsSL https://download.docker.com/linux/ubuntu/gpg -o /etc/apt/keyrings/docker.asc
      chmod a+r /etc/apt/keyrings/docker.asc
      echo "deb [arch=$(dpkg --print-architecture) signed-by=/etc/apt/keyrings/docker.asc] https://download.docker.com/linux/ubuntu $(. /etc/os-release && echo "$VERSION_CODENAME") stable" > /etc/apt/sources.list.d/docker.list
      apt-get update
      apt-get install -y docker-ce docker-ce-cli containerd.io docker-buildx-plugin docker-compose-plugin

      systemctl enable --now docker

      ufw allow OpenSSH
      ufw allow 80/tcp
      ufw allow 443/tcp
      ufw --force enable

      if [ ! -d "$APP_DIR/.git" ]; then
        rm -rf "$APP_DIR"
        git clone "$PUBLIC_REPO_URL" "$APP_DIR"
      fi

      cd "$APP_DIR"
      if [ ! -f .env ]; then
        cp .env.example .env
      fi

      set -a
      . ./.env
      set +a

      docker compose --env-file .env -f docker-compose.prod.yml build
      docker compose --env-file .env -f docker-compose.prod.yml up -d db

      for i in $(seq 1 60); do
        if docker compose --env-file .env -f docker-compose.prod.yml exec -T db pg_isready -U "${POSTGRES_USER}" -d "${POSTGRES_DB}" >/dev/null 2>&1; then
          break
        fi
        if [ "$i" -eq 60 ]; then
          echo "database did not become ready" >&2
          exit 1
        fi
        sleep 2
      done

      docker compose --env-file .env -f docker-compose.prod.yml exec -T db psql -U "${POSTGRES_USER}" -d "${POSTGRES_DB}" < db/schema.sql
      for migration in db/migrations/*.sql; do
        [ -f "$migration" ] || continue
        docker compose --env-file .env -f docker-compose.prod.yml exec -T db psql -U "${POSTGRES_USER}" -d "${POSTGRES_DB}" < "$migration"
      done

      docker compose --env-file .env -f docker-compose.prod.yml up -d

runcmd:
  - [bash, /opt/phoenix-feed/bootstrap.sh]
