x-app-env: &app-env
  DATABASE_URL: ${DATABASE_URL}
  LOG_LEVEL: ${LOG_LEVEL:-info}
  SOURCE_DEGRADED_AFTER: ${SOURCE_DEGRADED_AFTER:-3m}
  SOURCE_DOWN_AFTER: ${SOURCE_DOWN_AFTER:-10m}
  SOURCE_DOWN_FAILURES: ${SOURCE_DOWN_FAILURES:-3}
  FROZEN_DOWN_AFTER: ${FROZEN_DOWN_AFTER:-10m}

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  db:
    image: postgis/postgis:16-3.4
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - phxfeed_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 12
    logging: *default-logging

  api:
    build:
      context: .
      dockerfile: deploy/docker/api.Dockerfile
    restart: always
    environment:
      <<: *app-env
      HTTP_ADDR: :8080
      ADMIN_TOKEN: ${ADMIN_TOKEN:-}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-}
    expose:
      - "8080"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/v1/health >/dev/null || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 6
    logging: *default-logging

  ingester:
    build:
      context: .
      dockerfile: deploy/docker/ingester.Dockerfile
    restart: always
    environment:
      <<: *app-env
      POLL_INTERVAL: ${POLL_INTERVAL:-60s}
      POLL_JITTER: ${POLL_JITTER:-10s}
      CLEAR_AFTER_MISSES: ${CLEAR_AFTER_MISSES:-5}
      FROZEN_REPEAT_COUNT: ${FROZEN_REPEAT_COUNT:-3}
      SUDDEN_COLLAPSE_PERCENT: ${SUDDEN_COLLAPSE_PERCENT:-80}
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "grep -q /usr/local/bin/ingester /proc/1/cmdline"]
      interval: 30s
      timeout: 5s
      retries: 6
    logging: *default-logging

  parser:
    build:
      context: .
      dockerfile: deploy/docker/dispatch-parser.Dockerfile
    restart: unless-stopped
    environment:
      <<: *app-env
      MAPBOX_TOKEN: ${MAPBOX_TOKEN}
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "grep -q /usr/local/bin/dispatch-parser /proc/1/cmdline"]
      interval: 30s
      timeout: 5s
      retries: 6
    logging: *default-logging

  canary:
    build:
      context: .
      dockerfile: deploy/docker/canary.Dockerfile
    restart: always
    environment:
      <<: *app-env
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "grep -q /usr/local/bin/canary /proc/1/cmdline"]
      interval: 30s
      timeout: 5s
      retries: 6
    logging: *default-logging

  janitor:
    build:
      context: .
      dockerfile: deploy/docker/janitor.Dockerfile
    restart: always
    environment:
      <<: *app-env
      RAW_RETENTION: ${RAW_RETENTION:-720h}
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "grep -q /usr/local/bin/janitor /proc/1/cmdline"]
      interval: 30s
      timeout: 5s
      retries: 6
    logging: *default-logging

  keygen:
    profiles: ["tools"]
    build:
      context: .
      dockerfile: deploy/docker/keygen.Dockerfile
    environment:
      <<: *app-env
      KEY_TIER: ${KEY_TIER:-paid}
      KEY_LABEL: ${KEY_LABEL:-manual}
      OWNER_EMAIL: ${OWNER_EMAIL:-}
    depends_on:
      db:
        condition: service_healthy
    logging: *default-logging

  caddy:
    build:
      context: .
      dockerfile: deploy/docker/caddy.Dockerfile
    restart: always
    environment:
      DOMAIN: ${DOMAIN:-:80}
      LANDING_DOMAIN: ${LANDING_DOMAIN:-}
      API_DOMAIN: ${API_DOMAIN:-}
      ADMIN_EMAIL: ${ADMIN_EMAIL}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - ./web/landing:/srv/landing:ro
      - /var/log/caddy:/var/log/caddy
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - api
    healthcheck:
      test: ["CMD-SHELL", "caddy validate --config /etc/caddy/Caddyfile >/dev/null 2>&1"]
      interval: 30s
      timeout: 5s
      retries: 6
    logging: *default-logging

volumes:
  phxfeed_data:
  caddy_data:
  caddy_config:
