<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Phoenix Incident Feed</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIINfQPD7V5xH5nsyw+Le4R1bK0bD41W4kM=" crossorigin="">
    <link rel="stylesheet" href="styles.css">
  </head>
  <body>
    <div class="banner">Not for emergency use; call 911.</div>
    <main class="shell">
      <section class="map-wrap" aria-label="Incident map">
        <div id="map"></div>
      </section>
      <aside class="list-wrap" aria-label="Active incidents">
        <header class="topbar">
          <div>
            <h1>Phoenix Incident Feed</h1>
            <p id="meta">Loading source status</p>
          </div>
          <button id="refresh" type="button">Refresh</button>
        </header>
        <div id="status" class="status" role="status"></div>
        <div id="incidents" class="incidents"></div>
        <footer>
          Data via City of Phoenix Fire Department. Map tiles via OpenStreetMap.
        </footer>
      </aside>
    </main>
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
    <script src="app.js"></script>
  </body>
</html>
